name: TXT checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'store/**', '**/*.md', 'VERIFICATION.json', 'release/verify-request.json', 'release/publish-request.json', 'tools/release-smoke.py', 'tools/stage-release.py', 'tools/package-public.py', '.github/workflows/publish-signed.yml', '.github/workflows/verify-release.yml', '.github/workflows/release.yml']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile, unit test, lint and shrink release
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Theme, editor, archive and file-operation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/android-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TXT-UI-api-${{ matrix.api }}
          path: app/build/outputs/ui-screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TXT-reports-api-${{ matrix.api }}
          path: app/build/reports/
      - uses: actions/upload-artifact@v4
        if: success() && matrix.api == 36
        with:
          name: TXT-unsigned-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/
  candidate:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TXT-unsigned-release
          path: unsigned
      - uses: actions/download-artifact@v4
        with:
          pattern: TXT-UI-api-*
          path: proof
      - name: Publish tested unsigned candidate for signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p candidate
          cp unsigned/apk/release/*.apk candidate/TXT-unsigned.apk
          cp unsigned/bundle/release/*.aab candidate/TXT-unsigned.aab
          cp unsigned/mapping/release/mapping.txt candidate/mapping.txt
          cp -r proof candidate/qa-proof
          tar -czf candidate/QA-proof.tar.gz -C candidate qa-proof
          sha256sum candidate/TXT-unsigned.apk candidate/TXT-unsigned.aab > candidate/SHA256SUMS
          gh release create "candidate-${{ github.run_number }}" --target "${{ github.sha }}" --prerelease --title "TXT tested signing candidate ${{ github.run_number }}" --notes 'Unsigned release APK/AAB after Android 8 and Android 16 checks. These are build inputs for signing, not the final install downloads. Use the stable versioned release for installation.' candidate/TXT-unsigned.apk candidate/TXT-unsigned.aab candidate/mapping.txt candidate/QA-proof.tar.gz candidate/SHA256SUMS
