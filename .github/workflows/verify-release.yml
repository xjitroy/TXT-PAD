name: Verify public signed APK
on:
  push:
    branches: [main]
    paths: [release/verify-request.json]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing versioned release tag
        required: true
        default: v1.1.0
permissions:
  contents: read
jobs:
  smoke:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download and verify public APK
        env:
          GH_TOKEN: ${{ github.token }}
          TXT_TAG: ${{ inputs.tag || 'v1.1.0' }}
        run: |
          mkdir -p release-input
          gh release download "$TXT_TAG" --pattern 'TXT.apk' --pattern 'SHA256SUMS' --dir release-input
          cd release-input
          sha256sum --ignore-missing -c SHA256SUMS
      - name: Build the separate synthetic input helper
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python3 tools/build-qa-input.py --out "$RUNNER_TEMP/txt-qa-input"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 tools/release-smoke.py --apk release-input/TXT.apk --out release-proof --input-helper ${{ runner.temp }}/txt-qa-input/TXT-qa-input.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TXT-signed-release-proof
          path: release-proof/
      - name: Publish signed build verification evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TXT_TAG: ${{ inputs.tag || 'v1.1.0' }}
        run: gh release upload "$TXT_TAG" release-proof/*.png release-proof/*.mp4 release-proof/RESULT.txt --clobber
