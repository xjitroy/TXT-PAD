name: Verify and publish signed artifacts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [release/publish-request.json]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record runner startup
        run: date -u > runner-checkpoint.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 2
        with:
          name: TXT-signed-runner-started
          path: runner-checkpoint.txt
          retention-days: 7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        timeout-minutes: 5
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;36.0.0'
        timeout-minutes: 5
      - name: Retrieve signed public files for the exact source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,re,subprocess,time
          request=json.loads(pathlib.Path('release/publish-request.json').read_text())
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',request['tag'])
          assert re.fullmatch(r'[0-9a-f]{40}',request['source_commit'])
          repo=os.environ['GITHUB_REPOSITORY']
          run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{int(request["verification_run"])}'],timeout=90))
          assert run['head_sha']==request['source_commit'],'Source SHA does not match the verification run'
          assert run['name']=='TXT checks','Expected the source regression workflow'
          assert run['status']!='completed' or run['conclusion']=='success','Source checks failed'
          allowed={'TXT.apk','TXT.aab','SHA256SUMS','release-metadata.json','TXT-source.zip','TXT-store-assets.zip','VERIFICATION.json','mapping.txt.gz'}
          assert set(request['files'])==allowed
          subprocess.run(['git','diff','--exit-code',request['source_commit'],'HEAD','--','app/src','app/build.gradle.kts','build.gradle.kts','settings.gradle.kts','gradle.properties','gradle','gradlew','gradlew.bat'],check=True)
          out=pathlib.Path('dist');out.mkdir(exist_ok=True)
          for name,entry in request['files'].items():
              assert re.fullmatch(r'[0-9a-f]{40}',entry['blob'])
              blob=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/blobs/{entry["blob"]}'],timeout=90))
              data=base64.b64decode(blob['content'])
              assert len(data)==entry['bytes'] and hashlib.sha256(data).hexdigest()==entry['sha256']
              (out/name).write_bytes(data)
          mapping=gzip.decompress((out/'mapping.txt.gz').read_bytes())
          assert len(mapping)<64*1024*1024 and hashlib.sha256(mapping).hexdigest()==request['mapping_sha256']
          (out/'mapping.txt').write_bytes(mapping)
          PY
      - name: Verify pinned signing identity, permissions and alignment
        timeout-minutes: 5
        run: TXT_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0" python3 tools/check-release.py dist/TXT.apk dist/TXT.aab --out dist/release-metadata.json
      - name: Prepare draft for diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TXT_TAG=$(python3 -c 'import json; print(json.load(open("release/publish-request.json"))["tag"])')
          TXT_SOURCE=$(python3 -c 'import json; print(json.load(open("release/publish-request.json"))["source_commit"])')
          if gh release view "$TXT_TAG" --json isDraft --jq .isDraft > /tmp/txt-draft-state; then
            test "$(cat /tmp/txt-draft-state)" = true
          else
            gh release create "$TXT_TAG" --target main --draft --title "TXT ${TXT_TAG#v}" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TXT_TAG" dist/TXT.apk dist/TXT.aab dist/release-metadata.json dist/SHA256SUMS --clobber
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 18
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 tools/release-smoke.py --apk dist/TXT.apk --out release-proof
      - name: Require successful source checks before publication
        timeout-minutes: 22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYGATE'
          import json,os,pathlib,subprocess,time
          request=json.loads(pathlib.Path('release/publish-request.json').read_text())
          repo=os.environ['GITHUB_REPOSITORY']
          deadline=time.monotonic()+20*60
          while True:
              run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{int(request["verification_run"])}'],timeout=90))
              assert run['head_sha']==request['source_commit'],'Source SHA does not match the verification run'
              if run['status']=='completed':
                  assert run['conclusion']=='success','Source checks failed; refusing to publish'
                  break
              jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{int(request["verification_run"])}/jobs?filter=latest'],timeout=90))['jobs']
              if len(jobs)==3 and {j['name'] for j in jobs}=={'verify (26)','verify (36)','candidate'} and all(j['status']=='completed' and j['conclusion']=='success' for j in jobs):
                  print('Exact source: both emulator jobs and candidate completed successfully; run summary is delayed.',flush=True)
                  break
              assert time.monotonic()<deadline,'Source checks are still queued; rerun publication after GitHub recovers'
              print('Waiting for the exact source verification run...',flush=True)
              time.sleep(15)
          PYGATE
      - name: Complete evidence packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          out=pathlib.Path('dist');request=json.loads(pathlib.Path('release/publish-request.json').read_text())
          report=json.loads((out/'VERIFICATION.json').read_text())
          report['instrumented_tests']['status']='PASS: exact source workflow succeeded on API 26 and 36'
          report['signed_release_smoke']='PASS: real signed minified APK UI/storage/encryption/archive flows'
          report['release_status']='PASS: verified signed APK and AAB published as the stable release'
          report['signed_release_workflow']=int(os.environ['GITHUB_RUN_ID'])
          report['release_metadata']=json.loads((out/'release-metadata.json').read_text())
          report['signed_release_result']=pathlib.Path('release-proof/RESULT.txt').read_text().strip()
          (out/'VERIFICATION.json').write_text(json.dumps(report,indent=2)+'\n')
          pathlib.Path('docs/RELEASE_STATUS.md').write_text('# TXT '+report['release_metadata']['versionName']+' release status\n\nPASS: source checks, local build, signatures, permissions, alignment and actual signed APK smoke.\n\nSource: `'+request['source_commit']+'`\n\nSource checks: https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+str(request['verification_run'])+'\n\nSigned APK proof: https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'\n\n'+report['signed_release_result']+'\n\nPhysical devices, TalkBack, 120 Hz and independent security audit remain unverified.\n')
          pathlib.Path('docs/signed-release-result.txt').write_text(report['signed_release_result']+'\n')
          pathlib.Path('VERIFICATION.json').write_text((out/'VERIFICATION.json').read_text())
          old=out/'TXT-source.zip';temp=out/'source-updated.zip'
          with zipfile.ZipFile(old) as src,zipfile.ZipFile(temp,'w',zipfile.ZIP_DEFLATED) as dest:
              for info in src.infolist():
                  payload=(out/'VERIFICATION.json').read_bytes() if info.filename=='TXT-PAD/VERIFICATION.json' else pathlib.Path('docs/RELEASE_STATUS.md').read_bytes() if info.filename=='TXT-PAD/docs/RELEASE_STATUS.md' else src.read(info.filename)
                  dest.writestr(info,payload)
              dest.write('release-proof/RESULT.txt','TXT-PAD/docs/signed-release-result.txt')
          temp.replace(old)
          old=out/'TXT-store-assets.zip';temp=out/'store-updated.zip'
          with zipfile.ZipFile(old) as src,zipfile.ZipFile(temp,'w',zipfile.ZIP_DEFLATED) as dest:
              for info in src.infolist():dest.writestr(info,src.read(info.filename))
              for f in pathlib.Path('release-proof').glob('*.png'):dest.write(f,'store/screenshots/'+f.name)
          temp.replace(old)
          names=['TXT.apk','TXT.aab','TXT-source.zip','TXT-store-assets.zip','mapping.txt','release-metadata.json','VERIFICATION.json']
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256((out/n).read_bytes()).hexdigest()+'  '+n+'\n' for n in names))
          PY
          TXT_TAG=$(python3 -c 'import json; print(json.load(open("release/publish-request.json"))["tag"])')
          gh release upload "$TXT_TAG" dist/TXT.apk dist/TXT.aab dist/TXT-source.zip dist/TXT-store-assets.zip dist/mapping.txt dist/release-metadata.json dist/SHA256SUMS dist/VERIFICATION.json release/signing-certificate.pem release-proof/*.png release-proof/*.mp4 release-proof/RESULT.txt --clobber
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERIFICATION.json docs/RELEASE_STATUS.md docs/signed-release-result.txt
          git commit -m "Record verified TXT $TXT_TAG signed release [skip ci]"
          git push origin HEAD:main
          TXT_RELEASE_COMMIT=$(git rev-parse HEAD)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TXT_TAG" > /tmp/txt-tag.json 2>/dev/null; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TXT_TAG" -f sha="$TXT_RELEASE_COMMIT" -F force=false
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TXT_TAG" -f sha="$TXT_RELEASE_COMMIT"
          fi
          gh release edit "$TXT_TAG" --draft=false --prerelease=false --latest --title "TXT ${TXT_TAG#v}" --notes-file RELEASE_NOTES.md
      - name: Preserve diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-proof
          if timeout 3s adb get-state > /dev/null 2>&1; then timeout 10s adb logcat -d -b crash > release-proof/crash-log.txt || true; fi
          tar -czf TXT-release-diagnostics.tar.gz release-proof
          TXT_TAG=$(python3 -c 'import json; print(json.load(open("release/publish-request.json"))["tag"])')
          gh release upload "$TXT_TAG" TXT-release-diagnostics.tar.gz --clobber || true
